<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escher - Image Art Morph</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Escher</h1>
      <p class="subtitle">Transform images with math-powered art effects</p>
    </header>

    <main>
      <!-- Upload -->
      <section id="upload-section">
        <div class="upload-zone" id="upload-zone">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p>Drop an image here or <span class="browse-link">browse</span></p>
          <p class="hint">PNG, JPG &mdash; will be resized for performance</p>
          <input type="file" id="file-input" accept="image/*" hidden>
        </div>
      </section>

      <!-- Workspace (shown after upload) -->
      <section id="workspace" hidden>

        <!-- Tabs -->
        <nav class="tabs" id="tabs">
          <button class="tab active" data-mode="escher">Escher Spiral</button>
          <button class="tab" data-mode="kaleidoscope">Kaleidoscope</button>
          <button class="tab" data-mode="conformal">Conformal Maps</button>
          <button class="tab" data-mode="hyperbolic">Hyperbolic</button>
          <button class="tab" data-mode="logspace">Log Space</button>
        </nav>

        <!-- Canvas -->
        <div class="canvas-wrapper">
          <canvas id="output-canvas"></canvas>
          <div class="canvas-overlay" id="canvas-overlay">
            <span class="spinner"></span>
            <span id="overlay-text">Rendering...</span>
          </div>
          <canvas id="drag-pad" class="drag-pad" hidden></canvas>
        </div>

        <!-- Escher Spiral -->
        <div class="controls mode-controls active" id="controls-escher">
          <div class="control-group">
            <label>Morph</label>
            <input type="range" id="escher-morph" min="0" max="100" value="0" step="1">
            <input type="number" class="cv" id="escher-morph-v" value="0" min="0" max="100" step="1">
          </div>
          <div class="control-group">
            <label>Scale Factor</label>
            <input type="range" id="escher-scale" min="2" max="512" value="64" step="1">
            <input type="number" class="cv" id="escher-scale-v" value="64" min="2" max="512" step="1">
          </div>
          <div class="control-group">
            <label>Zoom</label>
            <input type="range" id="escher-zoom" min="10" max="500" value="100" step="1">
            <input type="number" class="cv" id="escher-zoom-v" value="100" min="10" max="500" step="1">
          </div>
          <div class="control-group">
            <label>Rotation</label>
            <input type="range" id="escher-rotation" min="-180" max="180" value="0" step="1">
            <input type="number" class="cv" id="escher-rotation-v" value="0" min="-180" max="180" step="1">
          </div>
        </div>

        <!-- Kaleidoscope -->
        <div class="controls mode-controls" id="controls-kaleidoscope">
          <div class="control-group">
            <label>Segments</label>
            <input type="range" id="kal-segments" min="3" max="24" value="6" step="1">
            <input type="number" class="cv" id="kal-segments-v" value="6" min="3" max="24" step="1">
          </div>
          <div class="control-group">
            <label>Rotation</label>
            <input type="range" id="kal-rotation" min="0" max="360" value="0" step="1">
            <input type="number" class="cv" id="kal-rotation-v" value="0" min="0" max="360" step="1">
          </div>
          <div class="control-group">
            <label>Zoom</label>
            <input type="range" id="kal-zoom" min="10" max="500" value="100" step="1">
            <input type="number" class="cv" id="kal-zoom-v" value="100" min="10" max="500" step="1">
          </div>
          <div class="control-group">
            <label>Offset X</label>
            <input type="range" id="kal-offx" min="-100" max="100" value="0" step="1">
            <input type="number" class="cv" id="kal-offx-v" value="0" min="-100" max="100" step="1">
          </div>
          <div class="control-group">
            <label>Offset Y</label>
            <input type="range" id="kal-offy" min="-100" max="100" value="0" step="1">
            <input type="number" class="cv" id="kal-offy-v" value="0" min="-100" max="100" step="1">
          </div>
        </div>

        <!-- Conformal Maps -->
        <div class="controls mode-controls" id="controls-conformal">
          <div class="control-group">
            <label>Function</label>
            <select id="conf-func">
              <option value="power">z^c (complex power)</option>
              <option value="mobius">Mobius (a*z+b)/(c*z+d)</option>
              <option value="inversion">1/z (inversion)</option>
              <option value="joukowski">Joukowski</option>
              <option value="sin">sin(z)</option>
              <option value="exp">e^z</option>
            </select>
          </div>
          <div class="control-group" id="conf-power-group">
            <label>Exponent (drag pad)</label>
            <span class="cv" id="conf-power-v">2.0 + 0.0i</span>
          </div>
          <div class="control-group">
            <label>Zoom</label>
            <input type="range" id="conf-zoom" min="10" max="500" value="100" step="1">
            <input type="number" class="cv" id="conf-zoom-v" value="100" min="10" max="500" step="1">
          </div>
          <p class="hint" id="conf-hint">Drag on the canvas to adjust the complex exponent</p>
        </div>

        <!-- Hyperbolic Tiling -->
        <div class="controls mode-controls" id="controls-hyperbolic">
          <div class="control-group">
            <label>p (polygon sides)</label>
            <input type="range" id="hyp-p" min="3" max="12" value="4" step="1">
            <input type="number" class="cv" id="hyp-p-v" value="4" min="3" max="12" step="1">
          </div>
          <div class="control-group">
            <label>q (at vertex)</label>
            <input type="range" id="hyp-q" min="3" max="12" value="6" step="1">
            <input type="number" class="cv" id="hyp-q-v" value="6" min="3" max="12" step="1">
          </div>
          <div class="control-group">
            <label>Rotation</label>
            <input type="range" id="hyp-rotation" min="0" max="360" value="0" step="1">
            <input type="number" class="cv" id="hyp-rotation-v" value="0" min="0" max="360" step="1">
          </div>
          <div class="control-group">
            <label>Layers</label>
            <input type="range" id="hyp-layers" min="1" max="6" value="3" step="1">
            <input type="number" class="cv" id="hyp-layers-v" value="3" min="1" max="6" step="1">
          </div>
        </div>

        <!-- Log Space -->
        <div class="controls mode-controls" id="controls-logspace">
          <div class="control-group">
            <label>Scale Factor</label>
            <input type="range" id="log-scale" min="2" max="512" value="64" step="1">
            <input type="number" class="cv" id="log-scale-v" value="64" min="2" max="512" step="1">
          </div>
          <div class="control-group">
            <label>Zoom</label>
            <input type="range" id="log-zoom" min="10" max="500" value="100" step="1">
            <input type="number" class="cv" id="log-zoom-v" value="100" min="10" max="500" step="1">
          </div>
          <div class="control-group">
            <label>Pan X</label>
            <input type="range" id="log-panx" min="-200" max="200" value="0" step="1">
            <input type="number" class="cv" id="log-panx-v" value="0" min="-200" max="200" step="1">
          </div>
          <div class="control-group">
            <label>Pan Y</label>
            <input type="range" id="log-pany" min="-200" max="200" value="0" step="1">
            <input type="number" class="cv" id="log-pany-v" value="0" min="-200" max="200" step="1">
          </div>
        </div>

        <!-- Shared buttons -->
        <div class="button-row">
          <button class="btn" id="btn-animate">Animate</button>
          <button class="btn" id="btn-download">Download PNG</button>
          <button class="btn" id="btn-gif">Export GIF</button>
          <button class="btn btn-outline" id="btn-change">Change Image</button>
        </div>
      </section>

      <canvas id="src-canvas" hidden></canvas>
    </main>

    <footer>
      <p>Conformal mapping art engine &middot; Inspired by <a href="https://youtu.be/ldxFjLJ3rVY" target="_blank">3Blue1Brown</a> &middot; De Smit &amp; Lenstra (2003)</p>
    </footer>
  </div>

  <script src="gif.js"></script>
  <script src="transform.js"></script>
  <script src="app.js"></script>
</body>
</html>
